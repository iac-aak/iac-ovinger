name: Rull ut nettverk (v2)

on:
  push:
    branches: [main]
    paths:
      - 'oving6/oppgave-6/stacks/nettverk/**'
      - 'oving6/oppgave-6/modules/network/**'
      - '.github/workflows/terraform-deploy-network-v2.yml'
      - '.github/workflows/terraform-env.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: nettverk
  cancel-in-progress: false

jobs:
  dev:
    uses: ./.github/workflows/terraform-env.yml
    with:
      miljo: dev
      plan_miljo: dev
    secrets: inherit

  test:
    needs: dev
    uses: ./.github/workflows/terraform-env.yml
    with:
      miljo: test
      plan_miljo: test
    secrets: inherit

  prod:
    needs: test
    uses: ./.github/workflows/terraform-env.yml
    with:
      miljo: prod
      # Ulik fra miljo: porten på prod ville ellers stoppet plan-jobben også
      plan_miljo: prod-plan
    secrets: inherit
