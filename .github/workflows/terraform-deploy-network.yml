name: Rull ut nettverk

on:
  push:
    branches: [main]
    paths:
      - 'oving5/oppgave-5/stacks/nettverk/**'
      - 'oving5/oppgave-5/modules/network/**'
      - '.github/workflows/terraform-deploy-webapp.yml'

  workflow_dispatch:
    inputs:
      environment:
        description: Miljø – gjelder bare ved manuell kjøring
        type: choice
        options: [dev, test, prod]
        default: dev

permissions:
  id-token: write
  contents: read

concurrency:
  group: nettverk-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Push gir tom input og dermed dev. Test og prod krever manuell kjøring.
    environment: ${{ inputs.environment || 'dev' }}

    defaults:
      run:
        working-directory: oving5/oppgave-5/stacks/nettverk

    env:
      MILJO: ${{ inputs.environment || 'dev' }}
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_INPUT: false
      TF_IN_AUTOMATION: true

    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Logg inn i Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Hent parameterfila for miljøet
        run: |
          az keyvault secret show \
            --vault-name "${{ secrets.KEYVAULT_NAME }}" \
            --name "tfvars-$MILJO" \
            --query value -o tsv > params.auto.tfvars

      - name: Init
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/oving5/oppgave-5/shared/backend.hcl" \
            -backend-config="key=env/$MILJO/nettverk.tfstate"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -out=tfplan

      - name: Apply
        run: terraform apply tfplan

      - name: Slett parameterfila
        if: always()
        run: rm -f params.auto.tfvars tfplan
