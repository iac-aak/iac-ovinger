name: PR-kontroller

on:
  pull_request:
    # Ingen paths-filter: sjekken er required, og en PR som ikke matcher et
    # filter får aldri rapportert den, så den blir stående som BLOCKED.
    branches: [main]

permissions:
  contents: read

jobs:
  kontroller:
    name: fmt og validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0

      - name: Sjekk formatering
        run: terraform fmt -check -recursive oving6

      - name: Klargjør providere uten backend
        working-directory: oving6/oppgave-6/stacks/nettverk
        run: terraform init -backend=false

      - name: Valider koden
        working-directory: oving6/oppgave-6/stacks/nettverk
        run: terraform validate