name: PR-kontroller

on:
  pull_request:
    # Ingen paths-filter: sjekken er required, og en PR som ikke matcher et
    # filter får aldri rapportert den, så den blir stående som BLOCKED.
    branches: [main]

permissions:
  contents: read

jobs:
  kontroll:
    # Nytt navn: jobben gjør mer enn fmt og validate nå. Dette er navnet som
    # velges som required status check i branch protection.
    name: kodekontroll
    runs-on: ubuntu-latest

    # Ingen environment, ingen Azure/login, ingen secrets.
    # Alle fire kontrollene er offline.
    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      # --- Installer verktøyene, med låste versjoner ---------------------
      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1

      - name: Installer TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.65.0

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer Checkov
        run: pip install checkov==3.3.21

      # --- Kjør kontrollene: det samme skriptet som kjøres lokalt ---------
      - name: Kjør valider.sh
        # Stien regnes fra rota av repoet, som alle stier i en workflow.
        run: bash oving8/oppgave-8/scripts/valider.sh
        env:
          # tflint --init laster ned Azure-pluginen fra GitHub. Med token
          # slipper man «rate limit» når mange kjører samtidig.
          GITHUB_TOKEN: ${{ github.token }}
